{% extends 'base.html' %}
{% block title %}{% if edit_mode %}Edit Product{% else %}Add Product{% endif %}{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <h3 class="fw-bold mb-4">{% if edit_mode %}Edit Product{% else %}Add Product / Add Stock{% endif %}</h3>
        <form method="post" enctype="multipart/form-data">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Product Name</label><input type="text" class="form-control" name="name" value="{{ product.name if product else '' }}" required></div>
            <div class="col-md-6"><label class="form-label">Category</label>
              <select class="form-select" name="category" required>
                <option value="Groceries">Groceries</option>
                <option value="Food">Food</option>
                <option value="Beverages">Beverages</option>
                <option value="Personal Care">Personal Care</option>
                <option value="Household">Household</option>
                <option value="Stationery">Stationery</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Fruits">Fruits</option>
                <option value="Dairy">Dairy</option>
                <option value="Electrical Items">Electrical Items</option>
                <option value="Agricultural Products">Agricultural Products</option>
                <option value="Local Products">Local Products</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6"><label class="form-label">Brand</label><input type="text" class="form-control" name="brand" value="{{ product.brand if product else '' }}" required></div>
            <div class="col-md-6"><label class="form-label">Manufacturer</label><input type="text" class="form-control" name="manufacturer" value="{{ product.manufacturer if product else '' }}" required></div>
            <div class="col-12"><label class="form-label">Product Description</label><textarea class="form-control" name="description" rows="3" required>{{ product.description if product else '' }}</textarea></div>
            <div class="col-md-4"><label class="form-label">Price</label><input type="number" step="0.01" class="form-control" name="price" value="{{ product.price if product else 0 }}" required></div>
            <div class="col-md-4"><label class="form-label">Original Stock Quantity</label><input type="number" class="form-control" name="original_stock" value="{{ product.original_stock if product else 0 }}" required></div>
            <div class="col-md-4"><label class="form-label">Low Stock Threshold</label><input type="number" class="form-control" name="low_stock_threshold" value="{{ product.low_stock_threshold if product else 5 }}" required></div>
            <div class="col-md-4"><label class="form-label">Manufacturing Date</label><input type="date" class="form-control" name="manufacturing_date" value="{{ product.manufacturing_date if product else '' }}" required></div>
            <div class="col-md-4"><label class="form-label">Expiry Date</label><input type="date" class="form-control" name="expiry_date" value="{{ product.expiry_date if product else '' }}" required></div>
            <div class="col-md-4"><label class="form-label">Delivery Charge</label><input type="number" step="0.01" class="form-control" name="delivery_charge" value="{{ product.delivery_charge if product else 20 }}" required></div>
            <div class="col-12"><label class="form-label">Delivery Info</label><input type="text" class="form-control" name="delivery_info" value="{{ product.delivery_info if product else 'Today, 5:00 PM - 7:00 PM' }}"></div>
            <div class="col-12">
              <label class="form-label">Product Image Upload</label>
              <input type="file" class="form-control" name="image" accept=".jpg,.jpeg,.png,.webp">
            </div>
          </div>
          <button type="submit" class="btn btn-success mt-4 w-100">Save Product</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
