{% extends 'base.html' %}
{% block title %}Customer Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card border-0 shadow-sm rounded-4 p-4 auth-card">
        <h3 class="text-center fw-bold mb-4">Customer Login</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" name="password" id="customerPassword" required>
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="customerPassword">Show</button>
            </div>
          </div>
          <div class="d-flex justify-content-between small">
            <a href="#" class="text-decoration-none">Forgot Password</a>
            <a href="{{ url_for('customer_register') }}" class="text-decoration-none">Register</a>
          </div>
          <button type="submit" class="btn btn-success w-100 mt-4">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
